spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/trugarden_db
    username: chis
    password: chis
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none  # Disable automatic schema generation, as Flyway will handle it.
    show-sql: false
    properties:
      hibernate:
        format_sql: true  # Hibernate will print the SQL statements in a more human-readable format
    database: PostgreSQL  # This helps Hibernate understand how to interact with the database correctly.
    database-platform: org.hibernate.dialect.PostgreSQLDialect  # The dialect defines how Hibernate should communicate with the database, including SQL syntax and data types.

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: http://localhost:8088/api/v1/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

application:
  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account
  security:
    jwt:
      expiration: 900000
      cookie-max-age-seconds: 900
      secret-key: 291d7b170fc96c6d87eed5d2fdf437eb20d508cc854cd34405818281c754bdab
  frontend:
    oauth-callback-url: ${FRONTEND_OAUTH_CALLBACK:http://localhost:3000/auth/callback}

server:
  port: 8088

payphone:
  token: ${PAYPHONE_TOKEN}
  base-url: ${PAYPHONE_BASE_URL}
  store-id: ${PAYPHONE_STORE_ID}
  callback-url: ${PAYPHONE_CALLBACK_URL}
  cancel-url: ${PAYPHONE_CANCEL_URL}

trugarden:
  email:
    provider: ${MAIL_PROVIDER}
    from: ${MAIL_FROM}
    api-key: ${MAIL_API_KEY}
  stock:
    reservation-ttl-minutes: 15
    expiration-check-interval-ms: 60000
    max-made-to-order-quantity-per-order: 10
  session:
    secret-key: ${SESSION_SECRET_KEY:defaultDevSecretKeyAtLeast32Chars!}
    cookie-max-age-seconds: 604800
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    sensitive-requests-per-minute: ${SENSITIVE_RATE_LIMIT_REQUESTS_PER_MINUTE:5}
  security:
    refresh:
      expiration-seconds: 2592000
      cookie-max-age-seconds: 2592000
  oauth:
    code-expiration-minutes: 5

storage:
  active-provider: CLOUDFLARE
  r2:
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}  # not recommended in production, change using custom domain